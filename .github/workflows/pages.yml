# GitHub Pages: main dalına her yüklemede siteyi derler ve yayınlar.
name: Siteyi yayınla
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VITE_BASE: /Butce-Kontrolu/
      # Herkese açık (publishable) değerler; veriler Supabase satır güvenliği (RLS) ile korunur
      VITE_SUPABASE_URL: https://fxmkecavnmoftbbxiefo.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_R0qQs_FicnCBEU38AcGwRg_fHXlBIqW
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      # Sayfa yenilenince (ör. /kartlar) uygulama açılsın diye
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
